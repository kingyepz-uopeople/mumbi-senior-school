<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" role="img" aria-label="Scout Association emblem">
  <!-- Official World Scout Emblem style: purple fleur-de-lis with rope and reef knot -->
  <defs>
    <linearGradient id="scoutPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7A3CAC"/>
      <stop offset="100%" stop-color="#5B2C86"/>
    </linearGradient>
  </defs>
  <g fill="url(#scoutPurple)">
    <!-- Centre petal -->
    <path d="M120 18c8 18 14 42 14 68 0 18-3 34-8 48l-6 22h-1l-6-22c-5-14-8-30-8-48 0-26 6-50 14-68z"/>
    <!-- Left petal -->
    <path d="M120 54c-22 8-42 28-54 54-8 18-10 34-8 48l14 8c2-16 8-30 18-44 12-18 26-30 38-36z"/>
    <!-- Right petal -->
    <path d="M120 54c22 8 42 28 54 54 8 18 10 34 8 48l-14 8c-2-16-8-30-18-44-12-18-26-30-38-36z"/>
    <!-- Base bar of fleur-de-lis -->
    <path d="M86 168h68l-8 18H94z"/>
    <!-- Left star -->
    <path d="M78 118l4.2 8.8 9.6 1.2-7.2 6.6 2 9.4L78 139l-8.6 4.9 2-9.4-7.2-6.6 9.6-1.2z"/>
    <!-- Right star -->
    <path d="M162 118l4.2 8.8 9.6 1.2-7.2 6.6 2 9.4-8.6-4.9-8.6 4.9 2-9.4-7.2-6.6 9.6-1.2z"/>
  </g>
  <!-- Rope ring -->
  <circle cx="120" cy="148" r="78" fill="none" stroke="#5B2C86" stroke-width="10" stroke-linecap="round"/>
  <circle cx="120" cy="148" r="78" fill="none" stroke="#9B6BC9" stroke-width="3" stroke-dasharray="6 10" opacity="0.55"/>
  <!-- Reef knot -->
  <g fill="#5B2C86">
    <ellipse cx="104" cy="228" rx="16" ry="11" transform="rotate(-28 104 228)"/>
    <ellipse cx="136" cy="228" rx="16" ry="11" transform="rotate(28 136 228)"/>
    <path d="M112 218c8 4 8 16 0 22-8-6-8-18 0-22zm16 0c8 4 8 16 0 22-8-6-8-18 0-22z"/>
    <path d="M120 214v36" stroke="#5B2C86" stroke-width="8" stroke-linecap="round"/>
    <path d="M108 250c8 10 24 10 32 0" fill="none" stroke="#5B2C86" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
